openapi: 3.0.3
info:
  title: MusOak API
  version: "2.0.0"
  description: |
    Everything the MusOak server does is reachable here. The CLI and the
    Discord bot are ordinary clients: they authenticate, search, make media
    ready, join rooms and follow the event stream.

    Two conventions matter:

    * `GET /api/v1/media/{variantId}` serves bytes and supports Range requests;
      it never starts a download. Ask for one with
      `POST /api/v1/media/{variantId}/download` first.
    * Room commands are REST calls; room state changes arrive on
      `GET /api/v1/ws` as events. The host reports its mixed-queue player state
      through `/sync`; every other client follows that position.
servers:
  - url: /
    description: the same host and port this document came from

tags:
  - name: library
  - name: media
  - name: rooms
  - name: auth

paths:
  /healthz:
    get:
      summary: Liveness probe
      operationId: healthz
      responses:
        "200":
          description: The server is up.
          content:
            text/plain:
              schema: { type: string, example: "ok\n" }

  /api/v1/openapi.yaml:
    get:
      summary: This specification
      operationId: getOpenAPISpec
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema: { type: string }

  /api/v1/providers:
    get:
      tags: [library]
      summary: List enabled providers and their capabilities
      operationId: listProviders
      responses:
        "200":
          description: Enabled providers.
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items: { $ref: "#/components/schemas/Provider" }

  /api/v1/artwork/{kind}/{artworkId}:
    get:
      tags: [library]
      summary: An entity's artwork
      description: |
        Serves the cover for a track, album, artist or playlist, or a user's
        icon. A provider's image is fetched once and cached on disk, so
        clients never talk to the provider CDNs themselves and a cover is
        downloaded once for the whole household. Responses carry a strong ETag
        and a long cache lifetime; artwork that has not been supplied yet
        answers 404.
      operationId: getArtwork
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [track, album, artist, playlist, user] }
        - name: artworkId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The image.
          headers:
            ETag:
              description: sha256 of the cached image.
              schema: { type: string }
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: Nothing is known for that entity yet.
        "502":
          description: The provider could not be reached; try again later.

  /api/v1/search:
    get:
      tags: [library]
      summary: Search every provider and merge the hits into canonical tracks
      operationId: search
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          description: Results per provider (maximum 50).
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - { $ref: "#/components/parameters/SearchPlatforms" }
      responses:
        "200":
          description: |
            Merged results. A provider that failed is reported in
            `providerErrors`; the other providers' hits are still returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/tracks/{trackId}:
    get:
      tags: [library]
      summary: One canonical track
      operationId: getTrack
      parameters: [{ $ref: "#/components/parameters/TrackID" }]
      responses:
        "200":
          description: The track.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Track" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/tracks/{trackId}/variants:
    get:
      tags: [library]
      summary: Every provider rendition of a track
      operationId: listTrackVariants
      parameters: [{ $ref: "#/components/parameters/TrackID" }]
      responses:
        "200":
          description: The renditions, with their download state.
          content:
            application/json:
              schema:
                type: object
                required: [variants]
                properties:
                  variants:
                    type: array
                    items: { $ref: "#/components/schemas/Variant" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/tracks/{trackId}/lyrics:
    get:
      tags: [library]
      summary: A rendition's lyrics
      description: |
        The words as one rendition has them: the copy's own timings when the
        source has them, otherwise plain text. variantId names the rendition
        the timings belong to; without it the track's own duration is used.
        Absent lyrics, an unknown rendition or an unreachable source all answer
        with null rather than an error.
      operationId: getTrackLyrics
      parameters:
        - { $ref: "#/components/parameters/TrackID" }
        - name: variantId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The rendition's lyrics, or null when there are none.
          content:
            application/json:
              schema:
                type: object
                required: [lyrics]
                properties:
                  lyrics:
                    nullable: true
                    type: object
                    required: [synced, plain, source, durationMs, variantId]
                    properties:
                      synced:
                        type: array
                        items:
                          type: object
                          required: [atMs, text]
                          properties:
                            atMs: { type: integer, format: int64 }
                            text: { type: string }
                      plain: { type: string }
                      source: { type: string }
                      durationMs: { type: integer, format: int64 }
                      variantId: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/tracks/{trackId}/resolve:
    post:
      tags: [library]
      summary: Make a track playable
      description: |
        If the track only has metadata-only renditions (Spotify), a matching
        rendition is searched for on the downloadable providers and attached to
        the same canonical track.
      operationId: resolveTrack
      parameters: [{ $ref: "#/components/parameters/TrackID" }]
      responses:
        "200":
          description: The track's renditions after resolution.
          content:
            application/json:
              schema:
                type: object
                required: [variants, playable]
                properties:
                  playable:
                    type: boolean
                    description: Whether a downloadable rendition now exists.
                  variants:
                    type: array
                    items: { $ref: "#/components/schemas/Variant" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/media/{variantId}:
    get:
      tags: [media]
      summary: Stream a finished rendition
      description: |
        Returns the stored Ogg/Opus file with Range support and an ETag of its
        sha256. Only complete files are ever served.
      operationId: getMedia
      parameters: [{ $ref: "#/components/parameters/VariantID" }]
      responses:
        "200":
          description: The whole file.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            audio/ogg:
              schema: { type: string, format: binary }
        "206":
          description: The requested byte range.
          content:
            audio/ogg:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/media/{variantId}/status:
    get:
      tags: [media]
      summary: Download state of a rendition
      operationId: getMediaStatus
      parameters: [{ $ref: "#/components/parameters/VariantID" }]
      responses:
        "200":
          description: The current state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaStatus" }

  /api/v1/media/{variantId}/download:
    post:
      tags: [media]
      summary: Start (or join) a download
      description: |
        Idempotent and deduplicated: concurrent callers share one transfer.
        Without `wait` the call returns immediately with the current state, and
        the status endpoint reports progress; with `wait=1` it blocks until the
        rendition is ready or failed.
      operationId: startMediaDownload
      parameters:
        - { $ref: "#/components/parameters/VariantID" }
        - name: wait
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: The rendition is ready (only with `wait`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaStatus" }
        "202":
          description: The download is running; poll the status endpoint.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaStatus" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The rendition cannot be downloaded (Spotify audio is DRM-protected); resolve the track first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: The provider failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/library/import:
    post:
      tags: [library]
      summary: Add local files to the library
      description: |
        Files are transcoded to Ogg/Opus, matched onto canonical tracks like
        any provider's rendition, and reported as local variants.
      operationId: importLibrary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  description: One file to import.
                dir:
                  type: string
                  description: A directory to scan; mutually exclusive with `path`.
      responses:
        "200":
          description: What was imported, plus per-file failures.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Create an account
      operationId: register
      requestBody: { $ref: "#/components/requestBodies/Credentials" }
      responses:
        "201":
          description: The account and a session token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: Registration is closed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The username is taken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Log in
      operationId: login
      requestBody: { $ref: "#/components/requestBodies/Credentials" }
      responses:
        "200":
          description: The account and a session token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current session
      operationId: logout
      responses:
        "204": { description: The session is gone. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/me:
    get:
      tags: [auth]
      summary: Describe the caller
      operationId: getMe
      responses:
        "200":
          description: Identity and server policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
    patch:
      tags: [auth]
      summary: Change your account settings
      description: |
        The account tab's save/discard fields: the display name and the
        platforms a search should ask by default. Each key is independent, so
        a client may save one without touching the other.
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  description: The name other people see; omit it to leave it unchanged.
                searchPlatforms:
                  type: array
                  description: |
                    Platforms a search should ask by default. An empty list
                    clears the preference, so the client's own default applies;
                    omit the key to leave it unchanged.
                  items: { type: string }
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/me/favorites:
    get:
      tags: [auth]
      summary: List favorites
      operationId: listFavorites
      responses:
        "200":
          description: The favorited tracks, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [tracks]
                properties:
                  tracks:
                    type: array
                    items: { $ref: "#/components/schemas/Track" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [auth]
      summary: Favorite a track
      operationId: addFavorite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trackId]
              properties:
                trackId: { type: string, format: uuid }
      responses:
        "204": { description: Favorited (idempotent). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/favorites/{trackId}:
    delete:
      tags: [auth]
      summary: Unfavorite a track
      operationId: removeFavorite
      parameters: [{ $ref: "#/components/parameters/TrackID" }]
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/providers/ranking:
    get:
      tags: [auth]
      summary: Your provider preference
      description: |
        `effective` is what decides which rendition is played: your own ranking,
        or the aggregate when you have none.
      operationId: getRanking
      responses:
        "200":
          description: The ranking.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ranking" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [auth]
      summary: Set your provider preference
      operationId: setRanking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ranking]
              properties:
                ranking:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: The stored ranking and the aggregate it changes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ranking" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/me/plays:
    post:
      tags: [account]
      summary: Record a listen
      description: |
        What was played and how much of it was heard, reported when a track
        stops. A listen shorter than five seconds is not recorded: a track
        skipped straight away is not a listen. A caller with no account is
        accepted and ignored, because the web reports plays either way.
      operationId: recordPlay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trackId]
              properties:
                trackId: { type: string, format: uuid }
                variantId: { type: string, format: uuid }
                playedMs: { type: integer, format: int64 }
                source:
                  type: string
                  description: Where the listen came from - "web", "cli", "room".
      responses:
        "204": { description: "Recorded, or not worth recording." }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/me/history:
    get:
      tags: [account]
      summary: What this account has listened to
      operationId: getHistory
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        "200":
          description: The listens, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [plays]
                properties:
                  plays:
                    type: array
                    items:
                      type: object
                      required: [track, variantId, playedMs, atMs]
                      properties:
                        track: { $ref: "#/components/schemas/Track" }
                        variantId: { type: string, format: uuid }
                        playedMs: { type: integer, format: int64 }
                        atMs: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/me/stats/top:
    get:
      tags: [account]
      summary: What this account plays most
      operationId: getTopTracks
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        "200":
          description: The most played, most played first.
          content:
            application/json:
              schema:
                type: object
                required: [tracks]
                properties:
                  tracks:
                    type: array
                    items:
                      type: object
                      required: [track, plays, lastPlayedAtMs]
                      properties:
                        track: { $ref: "#/components/schemas/Track" }
                        plays: { type: integer }
                        lastPlayedAtMs: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/me/playback:
    get:
      tags: [auth]
      summary: What you were last playing
      description: |
        The queue, the song and the timestamp saved from an earlier session, as a
        document the server keeps exactly as it arrives. With nothing stored the
        state is an empty object, so restoring is the same code path either way.
      operationId: getPlaybackState
      responses:
        "200":
          description: The saved state, or an empty object.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [auth]
      summary: Save what you are playing
      description: |
        Replaces the caller's saved state. The document is a JSON object the
        server does not interpret: what "the queue you were on" means is the
        client's to describe.
      operationId: setPlaybackState
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaybackState" }
      responses:
        "200":
          description: The saved state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackState" }
        "400":
          description: The state was not a JSON object, or was too large.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/me/playlists:
    get:
      tags: [auth]
      summary: List your playlists
      operationId: listPlaylists
      responses:
        "200":
          description: Your playlists, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [playlists]
                properties:
                  playlists:
                    type: array
                    items: { $ref: "#/components/schemas/Playlist" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [auth]
      summary: Create a playlist
      operationId: createPlaylist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                public:
                  type: boolean
                  description: |
                    Who may see it. Defaults to true: a playlist is public until
                    its owner says otherwise.
      responses:
        "201":
          description: The new playlist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Playlist" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/me/playlists/import:
    post:
      tags: [auth]
      summary: Start importing a playlist from a platform
      description: |
        Copies a provider's playlist into one of your own. Every track is matched
        into the library and then resolved, so what comes out can be played here
        rather than only described. A Spotify playlist needs no credentials: a
        public one is read from its embed page, so a link is enough.

        One track is a provider search, so this answers with a job id straight
        away and the work carries on; poll the job for how far it has got.
      operationId: importPlaylist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider:
                  type: string
                  description: The platform the playlist comes from.
                  enum: [ytmusic, spotify]
                id:
                  type: string
                  description: The provider's playlist id, when it is known.
                url:
                  type: string
                  description: The link the playlist was copied from.
                name:
                  type: string
                  description: Overrides the playlist's own name.
      responses:
        "202":
          description: The import has started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistImport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/me/playlist-imports/{jobId}:
    get:
      tags: [auth]
      summary: How far a playlist import has got
      description: |
        `done` of `total` is the count of tracks matched so far, which is the
        only honest measure: each one is a provider search.
      operationId: importPlaylistStatus
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The job as it stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistImport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/me/playlists/{playlistId}/archives:
    post:
      tags: [auth]
      summary: Start downloading a playlist as a zip
      description: |
        Reads the playlist and answers with an archive to watch. The songs are
        counted here, so a client knows how many to expect before a single byte
        moves, and the download then reports its progress by song.

        An archive is written once, straight into the download: the request for
        the file streams every song in the playlist as an `.opus` entry, and any
        song the server has not fetched yet is fetched on the way. That means a
        playlist nothing has played takes as long as its downloads do, which is
        what the progress is for.
      operationId: startPlaylistArchive
      parameters:
        - name: playlistId
          in: path
          required: true
          schema: { type: string }
      responses:
        "202":
          description: The archive, ready to be downloaded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistArchive" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/me/playlist-archives/{archiveId}:
    get:
      tags: [auth]
      summary: How much of a playlist zip has been written
      description: |
        `done` of `total` songs. A song the server could not prepare is passed
        over, so an archive can finish with `done` below `total`.
      operationId: playlistArchiveStatus
      parameters:
        - name: archiveId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The archive as it stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistArchive" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/me/playlist-archives/{archiveId}/file:
    get:
      tags: [auth]
      summary: Download a playlist zip
      description: |
        The archive itself, as a zip of `.opus` files named after the songs. It
        streams as it is written, so it has no length up front and cannot be
        resumed. One archive is downloaded once; a second reader is told to ask
        for a new one, since writing it is the work.
      operationId: downloadPlaylistArchive
      parameters:
        - name: archiveId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The archive.
          content:
            application/zip:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: This archive has already been downloaded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/me/playlists/{playlistId}:
    get:
      tags: [auth]
      summary: One playlist with its tracks
      operationId: getPlaylist
      parameters: [{ $ref: "#/components/parameters/PlaylistID" }]
      responses:
        "200":
          description: The playlist and its entries in play order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [auth]
      summary: Rename a playlist, change who may see it, or both
      operationId: renamePlaylist
      parameters: [{ $ref: "#/components/parameters/PlaylistID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Either field may be given; at least one is needed.
              properties:
                name: { type: string }
                public:
                  type: boolean
                  description: |
                    Public playlists are visible on the owner's page to anyone
                    who may see that page; private ones are only ever their
                    owner's.
      responses:
        "200":
          description: The updated playlist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Playlist" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [auth]
      summary: Delete a playlist
      operationId: deletePlaylist
      parameters: [{ $ref: "#/components/parameters/PlaylistID" }]
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/playlists/{playlistId}/items:
    post:
      tags: [auth]
      summary: Append tracks
      operationId: addPlaylistItems
      parameters: [{ $ref: "#/components/parameters/PlaylistID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                trackId: { type: string, format: uuid }
                trackIds:
                  type: array
                  items: { type: string, format: uuid }
              description: Either `trackId` or `trackIds`; both may be given.
      responses:
        "200":
          description: The playlist after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/playlists/{playlistId}/items/{position}:
    delete:
      tags: [auth]
      summary: Remove the entry at a position
      operationId: removePlaylistItem
      parameters:
        - { $ref: "#/components/parameters/PlaylistID" }
        - name: position
          in: path
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: The playlist after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/playlists/{playlistId}/artwork:
    put:
      tags: [playlists]
      summary: Set a playlist's cover
      description: |
        Stores an image as the cover of one of the caller's playlists, replacing
        any it had. The image is kept where other artwork is cached, so serving
        it afterwards is the same path as any other cover, and the playlist's
        `artworkUrl` points at it.
      operationId: setPlaylistArtwork
      parameters: [{ $ref: "#/components/parameters/PlaylistID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaylistArtwork" }
      responses:
        "200":
          description: The playlist, with its new cover.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Playlist" }
        "400":
          description: The image is empty, not base64, or not a type this serves.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: The image is larger than the limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/me/playlists/{playlistId}/reorder:
    post:
      tags: [auth]
      summary: Reorder the playlist
      operationId: reorderPlaylist
      parameters: [{ $ref: "#/components/parameters/PlaylistID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order]
              properties:
                order:
                  type: array
                  description: The current positions, in their new order.
                  items: { type: integer, minimum: 0 }
      responses:
        "200":
          description: The playlist after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/uploads:
    get:
      tags: [library]
      summary: List your uploads
      description: The Manage tab's own list; everything the caller has contributed.
      operationId: listUploads
      responses:
        "200":
          description: The caller's uploads.
          content:
            application/json:
              schema:
                type: object
                required: [uploads]
                properties:
                  uploads:
                    type: array
                    items: { $ref: "#/components/schemas/Upload" }
    post:
      tags: [library]
      summary: Upload a song
      description: |
        Stores a file as a user-sourced variant, visible to every user and
        ranked first in search. `associateTrackId` names the canonical track it
        becomes a source of; the empty string means No Association, in which
        case a track of its own is created. Associating never clobbers the
        upload's own metadata: the variant keeps the title, artists and album
        sent here.
      operationId: createUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, contentType, data, title, artists]
              properties:
                filename: { type: string }
                contentType: { type: string, example: audio/ogg }
                data:
                  type: string
                  description: The audio file, base64 encoded; 64 MiB decoded at most.
                title: { type: string }
                artists: { type: array, items: { type: string } }
                album: { type: string }
                durationMs: { type: integer, format: int64 }
                artworkData:
                  type: string
                  description: The cover image, base64 encoded.
                artworkContentType: { type: string, example: image/jpeg }
                associateTrackId:
                  type: string
                  description: |
                    The track to become a source of, or "" for No Association
                    (a track of its own is created).
      responses:
        "201":
          description: The upload.
          content:
            application/json:
              schema:
                type: object
                required: [upload]
                properties:
                  upload: { $ref: "#/components/schemas/Upload" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413":
          description: The decoded file is larger than the limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/uploads/all:
    get:
      tags: [library]
      summary: List every user's uploads
      description: The Manage tab lists the caller's own; this one is for admin and inspection.
      operationId: listAllUploads
      responses:
        "200":
          description: Every upload.
          content:
            application/json:
              schema:
                type: object
                required: [uploads]
                properties:
                  uploads:
                    type: array
                    items: { $ref: "#/components/schemas/Upload" }

  /api/v1/uploads/association:
    get:
      tags: [library]
      summary: The caller's upload already associated with a song
      description: |
        One association per user per song: associating an upload with a song
        replaces any association the same user already had there, and the
        upload that loses it goes back to standing on its own. This reports the
        upload that would be replaced, so a client can say so first. Null when
        the caller has none on that song.
      operationId: getUploadAssociation
      parameters:
        - name: trackId
          in: query
          required: true
          schema: { type: string }
          description: The canonical track to look up.
      responses:
        "200":
          description: The upload the caller has there, or null.
          content:
            application/json:
              schema:
                type: object
                required: [upload]
                properties:
                  upload:
                    nullable: true
                    allOf: [{ $ref: "#/components/schemas/Upload" }]
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/uploads/duplicates:
    get:
      tags: [library]
      summary: List your uploads that are the same file
      description: |
        Groups the caller's own uploads by the content hash of the bytes they
        hold, keeping only hashes more than one upload shares.
      operationId: listUploadDuplicates
      responses:
        "200":
          description: The groups of identical uploads.
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items:
                      type: object
                      required: [sha256, uploads]
                      properties:
                        sha256: { type: string }
                        uploads:
                          type: array
                          items: { $ref: "#/components/schemas/Upload" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/uploads/associate:
    post:
      tags: [library]
      summary: Associate several uploads with one song
      description: |
        Points each named upload at the same canonical track, or with an empty
        associateTrackId back to a track of its own. The selected uploads keep
        the song; the caller's other uploads already on it are released. The
        request is refused whole if any id is not the caller's own upload.
      operationId: associateUploads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uploadIds, associateTrackId]
              properties:
                uploadIds:
                  type: array
                  maxItems: 100
                  items: { type: string }
                associateTrackId:
                  type: string
                  description: The track to become a source of, or "" to dissociate each.
      responses:
        "200":
          description: The uploads now associated, and any released.
          content:
            application/json:
              schema:
                type: object
                required: [uploads, released]
                properties:
                  uploads:
                    type: array
                    items: { $ref: "#/components/schemas/Upload" }
                  released:
                    type: array
                    items: { $ref: "#/components/schemas/Upload" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/uploads/{uploadId}:
    patch:
      tags: [library]
      summary: Change an upload's association
      description: |
        Points the upload at another canonical track, or at none. The upload's
        own title, artists and album are left as they are.

        One association per user per song: a second upload associated with the
        same song takes the association, and the earlier one stands on its own
        again.
      operationId: patchUpload
      parameters: [{ $ref: "#/components/parameters/UploadID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [associateTrackId]
              properties:
                associateTrackId:
                  type: string
                  description: The track to become a source of, or "" to dissociate.
      responses:
        "200":
          description: The upload.
          content:
            application/json:
              schema:
                type: object
                required: [upload]
                properties:
                  upload: { $ref: "#/components/schemas/Upload" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [library]
      summary: Remove an upload
      operationId: deleteUpload
      parameters: [{ $ref: "#/components/parameters/UploadID" }]
      responses:
        "204": { description: Gone. }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/users/{userId}/uploads:
    get:
      tags: [library]
      summary: One person's uploads
      description: |
        The songs this person uploaded. Uploaded songs are visible to every
        user, so this needs no account: a guest and any signed-in user see the
        same list. An id that names no account is a 404.
      operationId: listUserUploads
      parameters: [{ $ref: "#/components/parameters/UserID" }]
      responses:
        "200":
          description: This person's uploads.
          content:
            application/json:
              schema:
                type: object
                required: [uploads]
                properties:
                  uploads:
                    type: array
                    items: { $ref: "#/components/schemas/Upload" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/tracks/{trackId}/sources:
    get:
      tags: [library]
      summary: Every source of a track
      description: |
        The renditions a listener can pick between: official sources first,
        then user uploads, each group ordered by net votes (up minus down)
        descending and then by provider ranking. Exactly one entry carries
        `default: true` — the caller's saved preference when there is one,
        otherwise the first in order — unless the track has no sources at all.
      operationId: listTrackSources
      parameters: [{ $ref: "#/components/parameters/TrackID" }]
      responses:
        "200":
          description: The sources, and the caller's saved preference.
          content:
            application/json:
              schema:
                type: object
                required: [sources, preferredVariantId]
                properties:
                  sources:
                    type: array
                    items: { $ref: "#/components/schemas/TrackSource" }
                  preferredVariantId:
                    type: string
                    description: The saved preference, "" when there is none (always for guests).
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [library]
      summary: Attach a provider pick to a track
      description: |
        Stores a rendition the caller picked from a provider's search as a
        source of this track. The pick is deliberate, so it is never re-matched
        against the library: it becomes a variant of exactly this track.
        Posting the same (provider, providerTrackId) twice returns the variant
        already stored. An unregistered provider is a 400.
      operationId: attachTrackSource
      parameters: [{ $ref: "#/components/parameters/TrackID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, providerTrackId, title]
              properties:
                provider: { type: string, example: ytmusic }
                providerTrackId: { type: string }
                title: { type: string }
                artists: { type: array, items: { type: string } }
                album: { type: string }
                durationMs: { type: integer, format: int64 }
                artworkUrl: { type: string }
      responses:
        "200":
          description: The track's renditions, with the pick among them.
          content:
            application/json:
              schema:
                type: object
                required: [variants]
                properties:
                  variants:
                    type: array
                    items: { $ref: "#/components/schemas/Variant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/variants/{variantId}/vote:
    post:
      tags: [library]
      summary: Vote on a source
      description: |
        One vote per user per variant: a new value replaces the old one and `0`
        withdraws it. Votes reshape the default ordering for everyone.
      operationId: voteVariant
      parameters: [{ $ref: "#/components/parameters/VariantID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: integer, enum: [1, -1, 0] }
      responses:
        "204": { description: Recorded. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/tracks/{trackId}/preference:
    put:
      tags: [auth]
      summary: Save your preferred source for a song
      description: |
        The chosen rendition wins over the default ordering when this caller
        plays the song, and `GET /api/v1/tracks/{trackId}/sources` reports it
        as `preferredVariantId`.
      operationId: setTrackPreference
      parameters: [{ $ref: "#/components/parameters/TrackID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variantId]
              properties:
                variantId: { type: string, format: uuid }
      responses:
        "204": { description: Saved. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/icon:
    post:
      tags: [auth]
      summary: Set your icon
      description: |
        Stores an image as the caller's icon, replacing any they had. It is
        kept where other artwork is cached, so serving it afterwards is the
        same path as any other cover, and the account's `iconUrl` points at it.
      operationId: setMeIcon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data, contentType]
              properties:
                data:
                  type: string
                  description: The image, base64 encoded.
                contentType:
                  type: string
                  description: One of image/png, image/jpeg, image/webp, image/gif, image/avif.
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/Profile" }
        "400":
          description: The image is empty, not base64, or not a type this serves.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413":
          description: The image is larger than the limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/me/password:
    post:
      tags: [auth]
      summary: Change your password
      operationId: changeMyPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password }
      responses:
        "204": { description: Changed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: The current password is wrong, or no one is logged in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/me/username:
    post:
      tags: [auth]
      summary: Change your username
      description: |
        The password proves it is you, so the UI asks for it in a confirm
        dialog before the rename.
      operationId: changeMyUsername
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, username]
              properties:
                password: { type: string, format: password }
                username: { type: string }
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: The password is wrong, or no one is logged in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The username is taken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/users:
    get:
      tags: [auth]
      summary: Search everyone
      description: |
        Finds accounts by name. Each entry carries what the caller's
        relationship to them is; `online` is derived from `lastPlayedAt`, which
        counts as online for five minutes.

        An empty `q` asks for the whole server. A server holding no more than
        fifty accounts answers with all of them and `directory: true`; a larger
        one answers with nothing and `directory: false`, so that a client can
        say "too many to list" rather than "nobody is here".
      operationId: searchUsers
      parameters: [{ $ref: "#/components/parameters/PeopleQuery" }]
      responses:
        "200":
          description: Matching accounts, or the whole server when it is small enough to list.
          content:
            application/json:
              schema:
                type: object
                required: [users, directory]
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/UserProfile" }
                  directory:
                    type: boolean
                    description: Whether an empty `q` was answered with the whole server.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/users/{userId}:
    get:
      tags: [auth]
      summary: One person's page
      description: |
        What the friend page is built from: the account, their public
        playlists, their favourites and what they played recently, plus
        everything they have ever shared with the caller.
      operationId: getUser
      parameters: [{ $ref: "#/components/parameters/UserID" }]
      responses:
        "200":
          description: The account and its lists.
          content:
            application/json:
              schema:
                type: object
                required: [user, publicPlaylists, favorites, recent, shared]
                properties:
                  user: { $ref: "#/components/schemas/UserProfile" }
                  publicPlaylists:
                    type: array
                    items: { $ref: "#/components/schemas/Playlist" }
                  favorites:
                    type: array
                    items: { $ref: "#/components/schemas/Track" }
                  recent:
                    type: array
                    items: { $ref: "#/components/schemas/Track" }
                  shared:
                    type: array
                    description: Everything this person has ever shared with the caller.
                    items: { $ref: "#/components/schemas/Share" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/users/{userId}/playback:
    get:
      tags: [auth]
      summary: What they are playing (listen along)
      description: |
        The playback document this person saved for themselves — the queue, the
        song and the timestamp — with their user id on it. The client replays
        it locally and keeps following by polling every couple of seconds.
        Someone who is neither them nor their friend gets 403.
      operationId: getUserPlayback
      parameters: [{ $ref: "#/components/parameters/UserID" }]
      responses:
        "200":
          description: |
            Their playback document, or just the user id when nothing is
            stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPlayback" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Not friends with this person.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/me/friends:
    get:
      tags: [auth]
      summary: Your friends and the pending requests
      operationId: listFriends
      responses:
        "200":
          description: Accepted friends, then the requests in each direction.
          content:
            application/json:
              schema:
                type: object
                required: [friends, incoming, outgoing]
                properties:
                  friends:
                    type: array
                    items: { $ref: "#/components/schemas/UserProfile" }
                  incoming:
                    type: array
                    description: Requests others sent you.
                    items: { $ref: "#/components/schemas/UserProfile" }
                  outgoing:
                    type: array
                    description: Requests you sent.
                    items: { $ref: "#/components/schemas/UserProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [auth]
      summary: Send a friend request
      operationId: addFriend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string }
      responses:
        "201":
          description: The requested account.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/UserProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No account by that name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/me/friends/{userId}/accept:
    post:
      tags: [auth]
      summary: Accept a friend request
      operationId: acceptFriend
      parameters: [{ $ref: "#/components/parameters/UserID" }]
      responses:
        "204": { description: Friends. }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/friends/{userId}:
    delete:
      tags: [auth]
      summary: Unfriend someone, or decline their request
      operationId: removeFriend
      parameters: [{ $ref: "#/components/parameters/UserID" }]
      responses:
        "204": { description: Gone. }

  /api/v1/me/friends/{userId}/ignore:
    post:
      tags: [auth]
      summary: Ignore someone
      description: Ignored people's shares never create notifications.
      operationId: ignoreUser
      parameters: [{ $ref: "#/components/parameters/UserID" }]
      responses:
        "204": { description: Ignored. }
    delete:
      tags: [auth]
      summary: Stop ignoring someone
      operationId: unignoreUser
      parameters: [{ $ref: "#/components/parameters/UserID" }]
      responses:
        "204": { description: Not ignored anymore. }

  /api/v1/me/shares:
    get:
      tags: [auth]
      summary: Everything shared with you (and by you)
      description: Every share touching the caller, in both directions, newest first.
      operationId: listShares
      responses:
        "200":
          description: The shares.
          content:
            application/json:
              schema:
                type: object
                required: [shares]
                properties:
                  shares:
                    type: array
                    items: { $ref: "#/components/schemas/Share" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [auth]
      summary: Share a song, or invite someone to a room
      description: |
        One song to one friend with `trackId`, or a room invitation with
        `roomId`. Either way the recipient gets a notification, unless they
        ignore the sender.
      operationId: createShare
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string, format: uuid }
                trackId:
                  type: string
                  format: uuid
                  description: The song to share.
                roomId:
                  type: string
                  description: The room to invite them to.
      responses:
        "201":
          description: The share.
          content:
            application/json:
              schema:
                type: object
                required: [share]
                properties:
                  share: { $ref: "#/components/schemas/Share" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/notifications:
    get:
      tags: [auth]
      summary: Your notifications
      operationId: listNotifications
      responses:
        "200":
          description: Every notification, and how many are unread.
          content:
            application/json:
              schema:
                type: object
                required: [notifications, unread]
                properties:
                  notifications:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }
                  unread: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/me/notifications/read:
    post:
      tags: [auth]
      summary: Mark every notification read
      operationId: markNotificationsRead
      responses:
        "204": { description: Read. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/radio:
    post:
      tags: [library]
      summary: Start a station from a track
      description: |
        Builds a station from the seed track using exactly the providers the
        caller names, interleaving their suggestions so the mix reflects the
        choice. Suggestions are matched into the canonical library, so a
        recording never appears twice and the seed itself is left out.

        Saving is the default: the station is stored as a playlist named after
        the seed. Guests can generate a station but cannot save one, because
        playlists belong to an account.
      operationId: createRadio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seedTrackId]
              properties:
                seedTrackId: { type: string, format: uuid }
                providers:
                  type: array
                  description: Providers to mix; empty means every enabled one that can build a station.
                  items: { type: string }
                length:
                  type: integer
                  description: How many tracks the station should hold.
                  default: 25
                  maximum: 200
                save:
                  type: boolean
                  description: Store the station as a playlist (default true).
                name: { type: string }
      responses:
        "200":
          description: The station, plus the playlist when it was saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadioResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: No selected provider has a rendition of the seed track.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/playlists/search:
    get:
      tags: [library]
      summary: Search playlists across the providers
      description: |
        Playlist hits from every provider that can browse them. A playlist
        belongs to one provider: two services offering a list of the same name
        are different playlists with different tracks, so they are never merged.
        Hits are recorded, so their covers come from this server and a sync can
        be asked for later by id.
      operationId: searchProviderPlaylists
      parameters:
        - { $ref: "#/components/parameters/SearchQuery" }
        - { $ref: "#/components/parameters/SearchLimit" }
        - { $ref: "#/components/parameters/SearchPlatforms" }
      responses:
        "200":
          description: Provider playlists, with the providers that failed.
          content:
            application/json:
              schema:
                type: object
                required: [query, playlists]
                properties:
                  query: { type: string }
                  playlists:
                    type: array
                    items: { $ref: "#/components/schemas/ProviderPlaylist" }
                  providerErrors:
                    type: array
                    items: { $ref: "#/components/schemas/ProviderProblem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/playlists/{playlistId}:
    get:
      tags: [library]
      summary: A playlist anyone may see
      description: |
        One of your own playlists, or somebody else's that its owner made
        public. A private playlist belonging to another account answers exactly
        like one that does not exist, so the route never says whose playlists
        are which.
      operationId: getSharedPlaylist
      parameters: [{ $ref: "#/components/parameters/PlaylistID" }]
      responses:
        "200":
          description: The playlist and its entries in play order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/playlists/{playlistId}/sync:
    post:
      tags: [library]
      summary: Sync a provider playlist into the library
      description: |
        Fetches the playlist's tracks from its provider, matches every one into
        the canonical library, and records them in playlist order. Playing or
        importing the playlist needs this: the returned tracks carry the ids a
        user playlist is built from. Syncing twice replaces the tracklist rather
        than duplicating it.
      operationId: syncProviderPlaylist
      parameters: [{ $ref: "#/components/parameters/PlaylistID" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncRequest" }
      responses:
        "200":
          description: The playlist and its tracks, in playlist order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderPlaylistSyncResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The playlist belongs to a provider that was not selected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/albums/search:
    get:
      tags: [library]
      summary: Search albums across the providers
      description: |
        Album hits from every provider that can browse them, matched into one
        canonical album per record. The same release found on two sources is one
        entry with two variants.
      operationId: searchAlbums
      parameters:
        - { $ref: "#/components/parameters/SearchQuery" }
        - { $ref: "#/components/parameters/SearchLimit" }
        - { $ref: "#/components/parameters/SearchPlatforms" }
      responses:
        "200":
          description: Canonical albums with their provider releases.
          content:
            application/json:
              schema:
                type: object
                required: [query, albums]
                properties:
                  query: { type: string }
                  albums:
                    type: array
                    items: { $ref: "#/components/schemas/Album" }
                  providerErrors:
                    type: array
                    items: { $ref: "#/components/schemas/ProviderProblem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/albums/{albumId}:
    get:
      tags: [library]
      summary: One album with its tracks
      operationId: getAlbum
      parameters: [{ $ref: "#/components/parameters/AlbumID" }]
      responses:
        "200":
          description: The album, its credits, releases and tracklist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Album" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/albums/{albumId}/sync:
    post:
      tags: [library]
      summary: Sync an album from its providers
      description: |
        Fetches the tracklist of each selected provider release, matches every
        track into the canonical library and attaches the result to the album,
        so one album can be played through another source's renditions. Tracks
        already on the album are not duplicated.
      operationId: syncAlbum
      parameters: [{ $ref: "#/components/parameters/AlbumID" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncRequest" }
      responses:
        "200":
          description: What the sync added, and the album's tracklist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The album has no provider release to sync from.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/artists/search:
    get:
      tags: [library]
      summary: Search artists across the providers
      operationId: searchArtists
      parameters:
        - { $ref: "#/components/parameters/SearchQuery" }
        - { $ref: "#/components/parameters/SearchLimit" }
        - { $ref: "#/components/parameters/SearchPlatforms" }
      responses:
        "200":
          description: Canonical artists with their provider pages.
          content:
            application/json:
              schema:
                type: object
                required: [query, artists]
                properties:
                  query: { type: string }
                  artists:
                    type: array
                    items: { $ref: "#/components/schemas/Artist" }
                  providerErrors:
                    type: array
                    items: { $ref: "#/components/schemas/ProviderProblem" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/artists/{artistId}:
    get:
      tags: [library]
      summary: One artist with their albums
      operationId: getArtist
      parameters: [{ $ref: "#/components/parameters/ArtistID" }]
      responses:
        "200":
          description: The artist, their provider pages and their albums.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artist" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/artists/{artistId}/sync:
    post:
      tags: [library]
      summary: Sync an artist from their providers
      description: |
        Records the artist's provider pages and pulls their albums into the
        canonical library. With `syncAlbums` the albums' tracklists are fetched
        too, which is what makes the whole discography playable.
      operationId: syncArtist
      parameters: [{ $ref: "#/components/parameters/ArtistID" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncRequest" }
      responses:
        "200":
          description: The albums that were pulled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The artist has no provider page to sync from.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/clock:
    get:
      summary: Server clock and room rules
      description: |
        Clients sample this (or ping the event socket) to estimate their offset
        from the server clock, which is what room positions are expressed in.
      operationId: getClock
      responses:
        "200":
          description: The server time in milliseconds since the epoch.
          content:
            application/json:
              schema:
                type: object
                required: [nowMs]
                properties:
                  nowMs: { type: integer, format: int64 }
                  listenTogether: { $ref: "#/components/schemas/SkipRules" }

  /api/v1/rooms:
    get:
      tags: [rooms]
      summary: List rooms
      operationId: listRooms
      responses:
        "200":
          description: Every room.
          content:
            application/json:
              schema:
                type: object
                required: [rooms]
                properties:
                  rooms:
                    type: array
                    items: { $ref: "#/components/schemas/Room" }
    post:
      tags: [rooms]
      summary: Open a room
      description: The caller becomes the host. Guests receive a member id here.
      operationId: createRoom
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                controls:
                  type: string
                  enum: [host, everyone]
                  default: everyone
                password:
                  type: string
                  description: Optional; joining the room then requires it.
      responses:
        "201":
          description: The room and the caller's member id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomEnvelope" }

  /api/v1/rooms/{roomId}:
    get:
      tags: [rooms]
      summary: Room state
      operationId: getRoom
      parameters: [{ $ref: "#/components/parameters/RoomID" }]
      responses:
        "200":
          description: The room, including the current track and its position.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/rooms/{roomId}/join:
    post:
      tags: [rooms]
      summary: Join a room
      operationId: joinRoom
      parameters: [{ $ref: "#/components/parameters/RoomID" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: The room's password, when it has one.
      responses:
        "200":
          description: The room and the caller's member id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomEnvelope" }
        "403":
          description: The password is wrong.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/rooms/{roomId}/leave:
    post:
      tags: [rooms]
      summary: Leave a room
      operationId: leaveRoom
      parameters: [{ $ref: "#/components/parameters/RoomID" }]
      responses:
        "204": { description: Gone. The last member leaving closes the room. }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/rooms/{roomId}/queue:
    post:
      tags: [rooms]
      summary: Add tracks to your queue
      description: |
        The tracks go on the caller's own queue, in the order given. The fair
        master queue — what the room actually plays — recomputes and reaches
        everyone on the room channel; an idle room starts playing as soon as
        there is anything to play.

        A run of tracks is one edit, not one per song: a playlist added to a
        room is a single recompute and a single event, and the room hears about
        it once. The batch is all or nothing — an unknown track leaves the queue
        untouched — and is capped at 500.
      operationId: queueTrack
      parameters: [{ $ref: "#/components/parameters/RoomID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                trackId: { type: string, format: uuid }
                trackIds:
                  type: array
                  maxItems: 500
                  items: { type: string, format: uuid }
              example: { trackIds: ["6f1c2a5e-9d3b-4f8a-8c21-2b7e0d4a91cc"] }
      responses:
        "200":
          description: The room after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [rooms]
      summary: Clear your queue
      description: |
        Drops every entry of the caller's own queue (the host may clear any
        member's). The master queue recomputes and reaches everyone on the
        room channel.
      operationId: clearQueue
      parameters:
        - { $ref: "#/components/parameters/RoomID" }
        - name: memberId
          in: query
          description: Whose queue to clear; the host's only, defaults to the caller's own.
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/RoomState" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/rooms/{roomId}/queue/{itemId}:
    delete:
      tags: [rooms]
      summary: Remove a queued entry
      description: |
        The entry leaves its owner's queue — the caller's own, or any member's
        when the host asks — and the master queue recomputes.
      operationId: removeQueueItem
      parameters:
        - { $ref: "#/components/parameters/RoomID" }
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The room after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/rooms/{roomId}/queue/reorder:
    post:
      tags: [rooms]
      summary: Reorder the queue
      description: |
        Reorders the caller's own queue (the host may reorder any member's),
        and the master queue recomputes from the new order.
      operationId: reorderQueue
      parameters: [{ $ref: "#/components/parameters/RoomID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemIds]
              properties:
                itemIds:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: The room after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/rooms/{roomId}/pause:
    post:
      tags: [rooms]
      summary: Pause the room
      operationId: pauseRoom
      parameters: [{ $ref: "#/components/parameters/RoomID" }]
      responses:
        "200": { $ref: "#/components/responses/RoomState" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Nothing is playing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/rooms/{roomId}/resume:
    post:
      tags: [rooms]
      summary: Resume a paused room
      operationId: resumeRoom
      parameters: [{ $ref: "#/components/parameters/RoomID" }]
      responses:
        "200": { $ref: "#/components/responses/RoomState" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Nothing is playing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/rooms/{roomId}/skip:
    post:
      tags: [rooms]
      summary: Skip the current track
      operationId: skipTrack
      parameters: [{ $ref: "#/components/parameters/RoomID" }]
      responses:
        "200": { $ref: "#/components/responses/RoomState" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Nothing is playing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/rooms/{roomId}/sync:
    post:
      tags: [rooms]
      summary: Report the host's current queue player state
      description: |
        The host reports its current mixed-queue entry, position and pause
        state when they change and once per second. The server timestamps the
        position and broadcasts it to the room. Send an empty `itemId` when
        the host queue has no current song. Only the host may report state.
      operationId: syncRoomPlayback
      parameters: [{ $ref: "#/components/parameters/RoomID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId, positionMs, started, paused]
              properties:
                itemId:
                  type: string
                  description: The room queue entry, empty when idle.
                trackId:
                  type: string
                  format: uuid
                  description: The canonical track for the queue entry.
                positionMs: { type: integer, format: int64, minimum: 0 }
                durationMs: { type: integer, format: int64, minimum: 0 }
                started: { type: boolean }
                paused: { type: boolean }
      responses:
        "204": { description: The host state was accepted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/rooms/{roomId}/seek:
    post:
      tags: [rooms]
      summary: Seek the room
      operationId: seekRoom
      parameters: [{ $ref: "#/components/parameters/RoomID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [positionMs]
              properties:
                positionMs: { type: integer, format: int64, minimum: 0 }
      responses:
        "200": { $ref: "#/components/responses/RoomState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/rooms/{roomId}/vote:
    post:
      tags: [rooms]
      summary: Score the current track
      description: |
        Votes run from 1 (bad) to 5 (great) and can be changed while the track
        plays. When enough members have voted and the mean is below the
        threshold, the server skips the track.
      operationId: voteTrack
      parameters: [{ $ref: "#/components/parameters/RoomID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score: { type: integer, minimum: 1, maximum: 5 }
      responses:
        "200": { $ref: "#/components/responses/RoomState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }




  /api/v1/ws:
    get:
      tags: [rooms]
      summary: Room events and clock sync
      description: |
        A WebSocket carrying every room event. Send
        `{"type":"ping","clientSentAt":<ms>}` to measure the clock offset: the
        reply carries `serverReceivedAt` and `serverSentAt`, so
        `offset = serverReceivedAt - (clientSentAt + clientReceivedAt) / 2`.
      operationId: eventStream
      parameters:
        - name: roomId
          in: query
          description: Only receive this room's events.
          schema: { type: string }
      responses:
        "101": { description: Switching protocols. }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  parameters:
    TrackID:
      name: trackId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VariantID:
      name: variantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RoomID:
      name: roomId
      in: path
      required: true
      schema: { type: string }
    SearchQuery:
      name: q
      in: query
      required: true
      schema: { type: string }
    PeopleQuery:
      name: q
      in: query
      description: |
        A name to look for. Empty asks for the whole server, which only a small
        one answers.
      schema: { type: string }
    SearchLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    SearchPlatforms:
      name: providers
      in: query
      description: |
        Which platforms to ask, comma-separated. Absent or empty asks every
        enabled one. A name that is not an enabled provider is an error, so a
        client that filtered everything out has to say so rather than silently
        getting the lot.
      schema: { type: string, example: "ytmusic,spotify" }
    AlbumID:
      name: albumId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ArtistID:
      name: artistId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PlaylistID:
      name: playlistId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UploadID:
      name: uploadId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserID:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }

  headers:
    ETag:
      description: sha256 of the file's contents.
      schema: { type: string }

  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [username, password]
            properties:
              username: { type: string }
              password: { type: string, format: password }

  responses:
    RoomState:
      description: The room after the command.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Room" }
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: A login is required (or the guest has no personal data).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Not a member of this room, or the room is host-controlled.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such track, rendition or room.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests; see Retry-After.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Provider:
      type: object
      required: [name, capabilities]
      properties:
        name: { type: string, example: ytmusic }
        capabilities: { $ref: "#/components/schemas/Capabilities" }
        missingDeps:
          type: array
          description: External binaries this provider needs but cannot find.
          items: { type: string }

    Capabilities:
      type: object
      required: [search, download]
      properties:
        search: { type: boolean }
        download:
          type: boolean
          description: False for metadata-only providers such as Spotify.

    Track:
      type: object
      required: [id, title, artists, albums]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        durationMs: { type: integer, format: int64 }
        artists: { type: array, items: { type: string } }
        albums: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        artworkUrl:
          type: string
          description: Path on this server for the cover, absent when none is known.

    Variant:
      type: object
      required: [id, trackId, provider, downloadable, media]
      properties:
        id: { type: string, format: uuid }
        trackId: { type: string, format: uuid }
        provider: { type: string, example: ytmusic }
        slot:
          type: string
          enum: ["self", "uploaded", ""]
          description: >-
            The reserved account-order position this rendition fills for the
            caller: "self" for their own upload, "uploaded" for somebody
            else's, and "" for a provider's own rendition. A client ranks a
            variant by its slot when it has one, and by its provider otherwise.
        providerTrackId: { type: string }
        title: { type: string }
        artists: { type: array, items: { type: string } }
        album: { type: string }
        durationMs: { type: integer, format: int64 }
        downloadable:
          type: boolean
          description: Whether its audio can be fetched at all.
        isrc: { type: string }
        media: { $ref: "#/components/schemas/MediaStatus" }

    MediaStatus:
      type: object
      required: [variantId, state]
      properties:
        variantId: { type: string, format: uuid }
        state:
          type: string
          enum: [none, downloading, ready, failed]
        progress:
          type: number
          format: double
          minimum: 0
          maximum: 1
        error: { type: string }
        durationMs: { type: integer, format: int64 }
        bytes: { type: integer, format: int64 }

    RankedVariant:
      type: object
      required: [track, variants]
      properties:
        track: { $ref: "#/components/schemas/Track" }
        variants: { type: array, items: { $ref: "#/components/schemas/Variant" } }

    SearchResponse:
      type: object
      required: [query, groups]
      properties:
        query: { type: string }
        groups:
          type: array
          description: Canonical tracks, merged across providers.
          items: { $ref: "#/components/schemas/RankedVariant" }
        providerErrors:
          type: array
          description: Providers that failed; the rest of the results stand.
          items:
            type: object
            required: [provider, error]
            properties:
              provider: { type: string }
              error: { type: string }

    ImportResult:
      type: object
      required: [imported]
      properties:
        imported:
          type: array
          items:
            type: object
            required: [track, variant]
            properties:
              track: { $ref: "#/components/schemas/Track" }
              variant: { $ref: "#/components/schemas/Variant" }
        failures: { type: array, items: { type: string } }

    User:
      type: object
      required: [id, username]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: Bearer token for the Authorization header.
        user: { $ref: "#/components/schemas/User" }

    Me:
      type: object
      properties:
        authenticated: { type: boolean }
        guest:
          type: boolean
          description: True when the server allows anonymous reading.
        user: { $ref: "#/components/schemas/User" }
        username:
          type: string
          description: The caller's own name; only when authenticated.
        displayName:
          type: string
          description: The caller's display name; only when authenticated.
        iconUrl:
          type: string
          description: |
            Path on this server for the caller's icon, empty until one is set;
            only when authenticated.
        searchPlatforms:
          type: array
          description: |
            The platforms this account wants a search to ask by default, only
            when authenticated. Empty when unset, in which case the client
            uses its own default.
          items: { type: string }
        requireLogin: { type: boolean }
        registrationOpen: { type: boolean }

    Ranking:
      type: object
      required: [ranking, effective, aggregate, default]
      properties:
        ranking: { type: array, items: { type: string } }
        effective:
          type: array
          description: What decides which rendition this user plays.
          items: { type: string }
        aggregate:
          type: array
          description: Mean position order across all ranked users.
          items: { type: string }
        default:
          type: array
          description: Configured fallback order.
          items: { type: string }

    RadioResult:
      type: object
      required: [seed, providers, tracks]
      properties:
        seed: { $ref: "#/components/schemas/Track" }
        providers:
          type: array
          description: The providers that contributed.
          items: { type: string }
        tracks:
          type: array
          items: { $ref: "#/components/schemas/Track" }
        providerErrors:
          type: array
          description: Providers that could not contribute, and why.
          items:
            type: object
            required: [provider, error]
            properties:
              provider: { type: string }
              error: { type: string }
        playlist: { $ref: "#/components/schemas/Playlist" }

    ProviderPlaylist:
      type: object
      required: [id, provider, title, trackCount, synced]
      properties:
        id:
          type: string
          format: uuid
          description: This library's id for the playlist, not the provider's.
        providerPlaylistId:
          type: string
          description: The platform's own id for the playlist, which is what
            importing it by id needs.
        provider: { type: string }
        title: { type: string }
        owner:
          type: string
          description: Who the playlist belongs to on the provider.
        description: { type: string }
        trackCount:
          type: integer
          description: |
            How many tracks the playlist has. A search hit may report zero when
            the provider does not say; syncing fills it in.
        artworkUrl:
          type: string
          description: Path on this server for the cover.
        synced:
          type: boolean
          description: Whether the tracklist has been pulled in already.

    ProviderPlaylistSyncResult:
      type: object
      required: [playlist, added, tracks]
      properties:
        playlist: { $ref: "#/components/schemas/ProviderPlaylist" }
        added:
          type: integer
          description: Entries that were not in the playlist before this sync.
        tracks:
          type: array
          description: The playlist's tracks, in playlist order.
          items: { $ref: "#/components/schemas/Track" }
        providerErrors:
          type: array
          items: { $ref: "#/components/schemas/ProviderProblem" }

    PlaybackState:
      type: object
      description: |
        What the caller was last playing: the queue, the song and the timestamp.
        The server stores the document as it arrives and does not interpret it.
      required: [state]
      properties:
        state:
          type: object
          additionalProperties: true
        updatedAt:
          type: integer
          format: int64

    PlaylistArtwork:
      type: object
      required: [data, contentType]
      properties:
        data:
          type: string
          description: The image, base64 encoded.
        contentType:
          type: string
          description: One of image/png, image/jpeg, image/webp, image/gif, image/avif.

    Album:
      type: object
      required: [id, title, artists, trackCount, providers]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        artists: { type: array, items: { type: string } }
        year: { type: string }
        trackCount:
          type: integer
          description: How many tracks the canonical album holds.
        providers:
          type: array
          description: Providers that know this album.
          items: { type: string }
        artworkUrl:
          type: string
          description: Path on this server for the cover.
        variants:
          type: array
          items: { $ref: "#/components/schemas/AlbumVariant" }
        tracks:
          type: array
          description: The tracklist, present on the album endpoint.
          items: { $ref: "#/components/schemas/Track" }

    AlbumVariant:
      type: object
      required: [id, provider, providerAlbumId, title]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        providerAlbumId: { type: string }
        title: { type: string }
        artists: { type: array, items: { type: string } }
        year: { type: string }
        trackCount: { type: integer }

    Artist:
      type: object
      required: [id, name, providers]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        providers:
          type: array
          items: { type: string }
        artworkUrl:
          type: string
          description: Path on this server for the portrait.
        variants:
          type: array
          items:
            type: object
            required: [id, provider, providerArtistId, name]
            properties:
              id: { type: string, format: uuid }
              provider: { type: string }
              providerArtistId: { type: string }
              name: { type: string }
        albums:
          type: array
          items: { $ref: "#/components/schemas/Album" }

    SyncRequest:
      type: object
      properties:
        providers:
          type: array
          description: What to sync from; empty means every known release.
          items: { type: string }
        resolve:
          type: boolean
          description: Also make sure each track has a playable rendition.
        syncAlbums:
          type: boolean
          description: Artist syncs only; fetch each album's tracklist too.

    SyncResult:
      type: object
      required: [providers, added]
      properties:
        albumId: { type: string, format: uuid }
        artistId: { type: string, format: uuid }
        providers: { type: array, items: { type: string } }
        added:
          type: integer
          description: Tracks the sync added to the library.
        tracks:
          type: array
          items: { $ref: "#/components/schemas/Track" }
        albums:
          type: array
          items: { $ref: "#/components/schemas/Album" }
        providerErrors:
          type: array
          items: { $ref: "#/components/schemas/ProviderProblem" }

    ProviderProblem:
      type: object
      required: [provider, error]
      properties:
        provider: { type: string }
        error: { type: string }

    PlaylistArchive:
      type: object
      required: [archiveId, state, done, total, fileName]
      properties:
        archiveId: { type: string }
        state:
          type: string
          enum: [ready, running, done, failed]
          description: |
            `ready` until a download claims it, `running` while songs are being
            written into it, then `done` or `failed`.
        done:
          type: integer
          description: How many songs have been written so far.
        total:
          type: integer
          description: How many songs the playlist holds.
        fileName:
          type: string
          description: What the browser should call the zip.
        error:
          type: string
          description: Why it failed, when it did.
    PlaylistImport:
      type: object
      required: [jobId, state]
      properties:
        jobId: { type: string }
        state:
          type: string
          enum: [running, done, failed]
        done:
          type: integer
          description: How many tracks have been matched so far.
        total:
          type: integer
          description: How many the source playlist holds.
        playable:
          type: integer
          description: How many of them have a rendition this server can play.
        playlist:
          allOf:
            - $ref: "#/components/schemas/Playlist"
          description: The new playlist, once the job is done.
        error:
          type: string
          description: Why it failed, when it did.
    Playlist:
      type: object
      required: [id, name, trackCount, public]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        public:
          type: boolean
          description: |
            Whether people other than the owner may see this playlist, and its
            tracks with it. New playlists are public.
        mine:
          type: boolean
          description: Whether the caller owns it, which is what decides if a
            client offers to edit it.
        trackCount: { type: integer }
        durationMs: { type: integer, format: int64 }
        artworkUrl:
          type: string
          description: |
            Path on this server for the playlist's cover, when it has one:
            either the image that was uploaded for it.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PlaylistDetail:
      allOf:
        - $ref: "#/components/schemas/Playlist"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                type: object
                required: [position, track]
                properties:
                  position: { type: integer }
                  track: { $ref: "#/components/schemas/Track" }

    SkipRules:
      type: object
      properties:
        skipThreshold: { type: number, format: double }
        minVotersForSkip: { type: integer }
        voterFractionForSkip: { type: number, format: double }

    RoomMember:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        userId: { type: string, format: uuid }
        name: { type: string }
        joinedAtMs: { type: integer, format: int64 }
        iconUrl:
          type: string
          description: The member's picture; empty for a guest.
        iconVersion:
          type: integer
          description: Changes when the picture does.

    QueueItem:
      type: object
      required: [id, trackId, title]
      properties:
        id: { type: string }
        trackId: { type: string, format: uuid }
        title: { type: string }
        addedBy: { type: string }
        addedAtMs: { type: integer, format: int64 }
        durationMs: { type: integer, format: int64 }
        artworkUrl: { type: string }
        artistIds: { type: array, items: { type: string, format: uuid } }


    RoomPlayback:
      type: object
      required: [item, positionMs, atMs]
      properties:
        item: { $ref: "#/components/schemas/QueueItem" }
        positionMs:
          type: integer
          format: int64
          description: Where the song is at `atMs`.
        atMs:
          type: integer
          format: int64
          description: |
            Server clock instant `positionMs` is true at. While `started` is
            true and `paused` is false, the room is at
            `positionMs + (serverNow - atMs)`.
        started:
          type: boolean
          description: |
            Whether the host's player has begun the song. Until it has, every
            client loads the song and holds it at the position.
        paused: { type: boolean }
        durationMs:
          type: integer
          format: int64
          description: The host's file length; the room's clock moves on when it reaches this.
        drivenBy:
          type: string
          enum: [host, server]
          description: |
            Whose player is the room's clock. `host` while the host has a live
            socket and reports its player state; `server` while the host is
            away, when the server keeps time and moves the room on by itself
            until the host comes back.
        votes:
          type: object
          additionalProperties: { type: integer }
        meanScore: { type: number, format: double }

    Room:
      type: object
      required: [id, name, host, controls, members, queues]
      properties:
        id: { type: string }
        name: { type: string }
        host: { type: string }
        controls: { type: string, enum: [host, everyone] }
        hasPassword:
          type: boolean
          description: Whether joining requires a password.
        createdAtMs: { type: integer, format: int64 }
        members: { type: array, items: { $ref: "#/components/schemas/RoomMember" } }
        memberCount: { type: integer }
        queues:
          type: object
          description: Each member's own queue, by member id.
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/QueueItem" }
        masterQueue:
          type: array
          description: |
            The fair mix the room plays: round-robin across the members in join
            order, one track each pass. The current song keeps its place here
            until the room moves off it.
          items: { $ref: "#/components/schemas/QueueItem" }
        current:
          allOf: [{ $ref: "#/components/schemas/RoomPlayback" }]
          nullable: true
          description: The song playing, or null when the room is idle.
        serverNowMs: { type: integer, format: int64 }
        seq:
          type: integer
          format: int64
          description: |
            The room's event counter at this instant; a client following the
            event stream refetches the state when it sees a gap.
        skip: { $ref: "#/components/schemas/SkipRules" }

    RoomEnvelope:
      type: object
      required: [room, memberId]
      properties:
        room: { $ref: "#/components/schemas/Room" }
        memberId:
          type: string
          description: This caller's member id, for guests to send as X-Member-Id.

    Profile:
      type: object
      required: [id, username, displayName, iconUrl]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        iconUrl:
          type: string
          description: |
            Path on this server for the icon, empty until one is set; then it
            is `/api/v1/artwork/user/{userId}`.
        searchPlatforms:
          type: array
          description: |
            Platforms this account wants a search to ask by default, on its own
            account view. Empty when unset.
          items: { type: string }

    UserProfile:
      allOf:
        - $ref: "#/components/schemas/Profile"
        - type: object
          required: [online, lastPlayedAt, listening, relationship]
          properties:
            online:
              type: boolean
              description: Whether they played something within the last five minutes.
            lastPlayedAt:
              type: string
              format: date-time
              nullable: true
              description: When they last played something; null when they never have.
            listening:
              allOf: [{ $ref: "#/components/schemas/PlaybackDocument" }]
              nullable: true
              description: What they are listening to, as their client's playback document; null when idle.
            relationship:
              type: string
              enum: [friend, pending-in, pending-out, none, ignored]

    PlaybackDocument:
      type: object
      description: |
        What a client was last playing: the queue, the song and the timestamp.
        The server stores the document as it arrives and does not interpret it;
        these are the keys this client convention fills in.
      properties:
        queue:
          type: array
          description: The saved queue; entries are the client's own, each carrying its track id.
          items:
            type: object
            required: [trackId]
            additionalProperties: true
            properties:
              trackId: { type: string, format: uuid }
        currentTrackId: { type: string, format: uuid }
        positionMs: { type: integer, format: int64 }
        paused: { type: boolean }
        savedAt:
          type: integer
          format: int64
          description: When the document was saved, milliseconds since the epoch.

    UserPlayback:
      allOf:
        - $ref: "#/components/schemas/PlaybackDocument"
        - type: object
          required: [userId]
          properties:
            userId: { type: string, format: uuid }

    Uploader:
      type: object
      description: The user who uploaded a source.
      required: [userId, username, displayName]
      properties:
        userId: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }

    Upload:
      type: object
      required: [id, trackId, variantId, title, artists, album, durationMs, uploader, official, associateTrackId, createdAt]
      properties:
        id: { type: string, format: uuid }
        trackId:
          type: string
          format: uuid
          description: The canonical track this is a source of.
        variantId:
          type: string
          format: uuid
          description: The user-source variant this upload is.
        title: { type: string }
        artists: { type: array, items: { type: string } }
        album: { type: string }
        durationMs: { type: integer, format: int64 }
        artworkUrl:
          type: string
          description: Path on this server for the cover, absent when none is known.
        uploader: { $ref: "#/components/schemas/Uploader" }
        official:
          type: boolean
          description: Always false; an upload is a user source.
        associateTrackId:
          type: string
          description: |
            The association as the client set it: the track id, or "" for No
            Association. It equals `trackId` when the upload is associated.
        createdAt: { type: string, format: date-time }

    TrackSource:
      type: object
      required: [variantId, provider, title, artists, album, durationMs, downloadable, mediaState, official, uploader, upvotes, downvotes, myVote, default]
      properties:
        variantId: { type: string, format: uuid }
        provider: { type: string, example: ytmusic }
        slot:
          type: string
          enum: ["self", "uploaded", ""]
          description: >-
            The reserved account-order position this source fills for the
            caller: "self" for their own upload, "uploaded" for somebody
            else's, and "" for a provider's own rendition.
        title: { type: string }
        artists: { type: array, items: { type: string } }
        album: { type: string }
        durationMs: { type: integer, format: int64 }
        downloadable:
          type: boolean
          description: Whether its audio can be fetched at all.
        mediaState:
          type: string
          enum: [none, downloading, ready, failed]
        official:
          type: boolean
          description: False for user uploads.
        uploader:
          allOf: [{ $ref: "#/components/schemas/Uploader" }]
          nullable: true
          description: The uploading user; null unless this is a user upload with a known uploader.
        upvotes: { type: integer }
        downvotes: { type: integer }
        myVote:
          type: integer
          enum: [1, -1, 0]
          description: This caller's vote; 0 when they have none, always for guests.
        default:
          type: boolean
          description: The source played by default; exactly one per track, unless it has no sources.

    Share:
      type: object
      required: [id, from, to, trackId, roomId, track, createdAt]
      properties:
        id: { type: string, format: uuid }
        from: { $ref: "#/components/schemas/UserProfile" }
        to: { $ref: "#/components/schemas/UserProfile" }
        trackId:
          type: string
          format: uuid
          nullable: true
          description: The shared song; null on a room invitation.
        roomId:
          type: string
          nullable: true
          description: The room the recipient was invited to; null on a song share.
        track:
          allOf: [{ $ref: "#/components/schemas/Track" }]
          nullable: true
          description: The shared song itself; null on a room invitation.
        createdAt: { type: string, format: date-time }

    Notification:
      type: object
      required: [id, kind, from, trackId, roomId, createdAt, read]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [share, room-invite] }
        from:
          allOf: [{ $ref: "#/components/schemas/UserProfile" }]
          nullable: true
          description: Who caused it; null when the sender's account is gone.
        trackId: { type: string, format: uuid, nullable: true }
        roomId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }
